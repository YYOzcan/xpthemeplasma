<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- XPThemePlasma: yalnızca XP oturumunda (FONTCONFIG_FILE) kullanılır.
     XP'nin varsayılan "Standart" yazı tipi yumuşatması: küçük boyutlarda Tahoma ve
     MS Sans Serif kenar yumuşatmasız, tam ipuçlu çizilir (ClearType XP'de varsayılan kapalıydı). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <test name="family" qual="any"><string>Tahoma</string></test>
    <test name="pixelsize" compare="less_eq"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>Microsoft Sans Serif</string></test>
    <test name="pixelsize" compare="less_eq"><double>16</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>Verdana</string></test>
    <test name="pixelsize" compare="less_eq"><double>13</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
